// ─── Persistence (Local) ────────────────────────────────────
const LOCAL_STATE_KEY = 'sl_local_state_v2';
const LOCAL_NOTES_KEY = 'sl_local_notes_v2';
const LOCAL_DOC_KEY = 'sl_local_docs';
const SYNC_CONFIG_KEY = 'sl_sync_config';

function loadLocal(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}
function saveLocal(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function loadState()  { return loadLocal(LOCAL_STATE_KEY); }
function saveState(s) { saveLocal(LOCAL_STATE_KEY, s); }
function loadNotes()  { return loadLocal(LOCAL_NOTES_KEY); }
function saveNotes(n) { saveLocal(LOCAL_NOTES_KEY, n); }
function loadDocs()   { return loadLocal(LOCAL_DOC_KEY); }
function saveDocs(d)  { saveLocal(LOCAL_DOC_KEY, d); }

function loadSyncCfg()  { return loadLocal(SYNC_CONFIG_KEY); }
function saveSyncCfg(c) { saveLocal(SYNC_CONFIG_KEY, c); }

function itemKey(cat, sub, name) { return `${cat}|${sub}|${name}`; }

// ─── Cloud Sync (GitHub) ────────────────────────────────────
const STATE_FILE = 'state.json';

function utf8ToBase64(str) {
  const encoder = new TextEncoder();
  const bytes = encoder.encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToUtf8(base64) {
  const binary = atob(base64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

async function fetchCloudState(token, repo) {
  const url = `https://api.github.com/repos/${repo}/contents/${STATE_FILE}`;
  const res = await fetch(url, {
    headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  _lastSyncSha = data.sha;
  const json = base64ToUtf8(data.content);
  return JSON.parse(json);
}

async function pushCloudState(token, repo, state, notes, docs, sha) {
  const url = `https://api.github.com/repos/${repo}/contents/${STATE_FILE}`;
  const payload = JSON.stringify({ items: state, notes: notes, docs: docs });
  const content = utf8ToBase64(payload);
  const body = { message: "sync", content: content, branch: "main" };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errBody = await res.text();
    throw new Error(`HTTP ${res.status}: ${errBody.slice(0, 100)}`);
  }
  const resData = await res.json();
  return resData.content.sha;
}

let _lastSyncSha = null;
let _syncing = false;
let _syncError = null;

function updateSyncUI(status, msg) {
  const el = document.getElementById('syncStatus');
  if (status === 'ok')       { el.innerHTML = '✅ 已同步'; el.style.color = '#43a047'; }
  else if (status === 'err') { el.innerHTML = `⚠️ ${msg}`; el.style.color = '#e53935'; }
  else if (status === 'busy'){ el.innerHTML = '🔄 同步中...'; el.style.color = '#fb8c00'; }
  else if (status === 'off') { el.innerHTML = '☁️ 未同步'; el.style.color = '#90a4ae'; }
}

async function syncToCloud() {
  const cfg = loadSyncCfg();
  if (!cfg || !cfg.token || !cfg.repo) {
    updateSyncUI('off');
    return;
  }
  if (_syncing) return;
  _syncing = true;
  updateSyncUI('busy');
  try {
    const sha = await pushCloudState(cfg.token, cfg.repo, loadState(), loadNotes(), loadDocs(), _lastSyncSha || undefined);
    _lastSyncSha = sha;
    _syncError = null;
    updateSyncUI('ok');
  } catch (e) {
    _syncError = e.message;
    updateSyncUI('err', e.message.includes('401') ? '令牌失效' : e.message.includes('404') ? '仓库不存在' : e.message);
  }
  _syncing = false;
}

async function syncFromCloud() {
  const cfg = loadSyncCfg();
  if (!cfg || !cfg.token || !cfg.repo) return;
  try {
    const data = await fetchCloudState(cfg.token, cfg.repo);
    if (data) {
      if (data.items) saveState(data.items);
      if (data.notes) saveNotes(data.notes);
      if (data.docs) saveDocs(data.docs);
      _syncError = null;
    }
  } catch (e) {
    // silent on first load
  }
}

async function manualSync() {
  const cfg = loadSyncCfg();
  if (!cfg || !cfg.token) {
    showSetup();
    return;
  }
  updateSyncUI('busy', '');
  await syncToCloud();
  await syncFromCloud();
  render();
}

async function manualPull() {
  const cfg = loadSyncCfg();
  if (!cfg || !cfg.token) {
    showSetup();
    return;
  }
  updateSyncUI('busy', '');
  await syncFromCloud();
  render();
}

  "补剂": { bg: "#fbe9e7", accent: "#c62828" },
  "待产用品": { bg: "#fff3e0", accent: "#bf360c" }
};

// ─── Render ─────────────────────────────────────────────────
function render() {
  const state = loadState();
  const notes = loadNotes();
  const docState = loadDocs();
  const app = document.getElementById('app');
  let total = 0, bought = 0;
  let html = '';

  for (const [bigCat, subs] of Object.entries(RAW_DATA)) {
    const cc = CAT_COLORS[bigCat] || { bg: '#f5f5f5', text: '#333', badge: '#ccc' };
    let catTotal = 0, catBought = 0;
    let subHtml = '';

    for (const [subCat, items] of Object.entries(subs)) {
      const sc = SUB_COLORS[subCat] || { bg: '#f5f5f5', accent: '#999' };
      let siHtml = '';
      for (const item of items) {
        const key = itemKey(bigCat, subCat, item.name);
        const isBought = state[key] !== undefined ? state[key] : (item.initBought || false);
        const noteText = notes[key] !== undefined ? notes[key] : (item.note || '');
        total++; catTotal++;
        if (isBought) { bought++; catBought++; }
        const dc = isBought ? 'done' : '';
        siHtml += `
          <div class="item-row" data-key="${key}">
            <div class="item-check ${dc}">${isBought ? '✓' : ''}</div>
            <div class="item-body">
              <div class="item-name ${dc}">${item.name}</div>
              <div class="item-meta">
                ${item.brand ? `<span class="brand">${item.brand}</span>` : ''}
                ${item.price ? `<span class="price">¥${item.price}</span>` : ''}
                ${noteText ? `<span class="note">📝 ${noteText}</span>` : ''}
              </div>
            </div>
            <div class="note-edit-btn" data-editkey="${key}" data-itemname="${item.name}" title="编辑备注">✎</div>
          </div>`;
      }
      subHtml += `
        <div class="sub-section">
          <div class="sub-header" style="background:${sc.bg};color:${sc.accent}" onclick="toggleSub(this)">
            ${subCat} <span style="margin-left:auto;font-size:10px;opacity:0.5">▾</span>
          </div>
          <div class="item-list">${siHtml}</div>
        </div>`;
    }

    html += `
      <div class="cat-group">
        <div class="cat-header" style="background:${cc.bg};color:${cc.text}" onclick="toggleCat(this)">
          ${bigCat}
          <span class="cat-badge" style="background:${cc.badge}">${catTotal}项 · ${catBought}已买</span>
          <span class="arrow">▾</span>
        </div>
        ${subHtml}
      </div>`;
  }

  // Documents
  let docHtml = '';
  for (let i = 0; i < DOCS.length; i++) {
    const dk = `doc_${i}`;
    const isDone = docState[dk] || false;
    docHtml += `
      <div class="doc-item" data-dockey="${dk}">
        <div class="doc-num">${i+1}.</div>
        <div class="doc-text" style="text-decoration:${isDone?'line-through':'none'};color:${isDone?'#9e9e9e':'#333'}">${DOCS[i]}</div>
        <div class="doc-check ${isDone ? 'done' : ''}">${isDone ? '✓' : ''}</div>
      </div>`;
  }
  docHtml = `
    <div class="doc-section">
      <div class="doc-header">📄 待办证件清单</div>
      ${docHtml}
    </div>`;

  html += docHtml;
  app.innerHTML = html;

  document.getElementById('totalCount').textContent = total + ' 项';
  document.getElementById('boughtCount').textContent = bought + ' 已买';
  document.getElementById('pendingCount').textContent = (total - bought) + ' 待买';

  // Bind item row clicks (toggle bought)
  document.querySelectorAll('.item-row').forEach(el => {
    el.addEventListener('click', function(e) {
      if (e.target.closest('.note-edit-btn')) return;
      const key = this.dataset.key;
      const s = loadState();
      s[key] = !(s[key] !== undefined ? s[key] : false);
      saveState(s);
      render();
      syncToCloud();
    });
  });

  // Bind note edit buttons
  document.querySelectorAll('.note-edit-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      openNoteModal(this.dataset.editkey, this.dataset.itemname);
    });
  });

  // Bind doc clicks
  document.querySelectorAll('.doc-item').forEach(el => {
    el.addEventListener('click', function() {
      const dk = this.dataset.dockey;
      const ds = loadDocs();
      ds[dk] = !(ds[dk] || false);
      saveDocs(ds);
      render();
      syncToCloud();
    });
  });
}

// ─── Note Modal ─────────────────────────────────────────────
let _editingNoteKey = null;

// 查找物品在 Excel/数据中自带的默认备注
function getItemDefaultNote(key) {
  const parts = key.split('|');
  if (parts.length !== 3) return '';
  const [cat, sub, name] = parts;
  try {
    const items = (RAW_DATA[cat] || {})[sub] || [];
    const item = items.find(i => i.name === name) || {};
    return item.note || '';
  } catch (e) { return ''; }
}

function openNoteModal(key, itemName) {
  _editingNoteKey = key;
  document.getElementById('noteItemName').textContent = itemName;
  const notes = loadNotes();
  // 优先显示用户改过的备注，否则显示原本自带的备注（可直接修改）
  const val = notes[key] !== undefined ? notes[key] : getItemDefaultNote(key);
  document.getElementById('noteInput').value = val;
  document.getElementById('noteModalOverlay').classList.add('show');
}

function hideNoteModal() {
  document.getElementById('noteModalOverlay').classList.remove('show');
  _editingNoteKey = null;
}

function saveNote() {
  if (!_editingNoteKey) return;
  const notes = loadNotes();
  const val = document.getElementById('noteInput').value.trim();
  notes[_editingNoteKey] = val; // 空字符串表示清除该备注
  saveNotes(notes);
  hideNoteModal();
  render();
  syncToCloud();
}

// ─── Toggle ─────────────────────────────────────────────────
function toggleCat(el) {
  el.classList.toggle('collapsed');
  const subs = el.closest('.cat-group').querySelectorAll('.sub-section');
  const collapsed = el.classList.contains('collapsed');
  subs.forEach(s => s.classList.toggle('collapsed', collapsed));
}

function toggleSub(el) {
  el.closest('.sub-section').classList.toggle('collapsed');
}

function resetAll() {
  if (confirm('确认重置所有勾选状态和备注？')) {
    localStorage.removeItem(LOCAL_STATE_KEY);
    localStorage.removeItem(LOCAL_NOTES_KEY);
    localStorage.removeItem(LOCAL_DOC_KEY);
    render();
    syncToCloud();
  }
}

// ─── Sync Setup Modal ───────────────────────────────────────
function showSetup() {
  const cfg = loadSyncCfg();
  document.getElementById('tokenInput').value = cfg.token || '';
  document.getElementById('repoInput').value = cfg.repo || 'BarryLiu-agent/shopping-list';
  document.getElementById('modalOverlay').classList.add('show');
}
function hideSetup() {
  document.getElementById('modalOverlay').classList.remove('show');
}
function saveSetup() {
  const token = document.getElementById('tokenInput').value.trim();
  const repo = document.getElementById('repoInput').value.trim() || 'BarryLiu-agent/shopping-list';
  if (!token) { alert('请输入 GitHub 令牌'); return; }
  saveSyncCfg({ token, repo });
  hideSetup();
  syncFromCloud().then(() => {
    render();
    syncToCloud();
  });
}

// ─── Init ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const cfg = loadSyncCfg();
  if (cfg && cfg.token) {
    await syncFromCloud();
  }
  render();
  if (cfg && cfg.token) {
    updateSyncUI('ok');
  }
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) hideSetup();
});
document.getElementById('noteModalOverlay').addEventListener('click', function(e) {
  if (e.target === this) hideNoteModal();
});
</script>

</body>
</html>
